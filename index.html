<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Презентація: Тарас Петриненко — «Україна»</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0a09; color: #f5f5f4; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; padding: 20px; }
    .header { text-align: center; padding: 10px; border-bottom: 1px solid #292524; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #fcd34d; }
    .slide-box { max-width: 900px; margin: auto; background: #1c1917; border: 1px solid #44403c; border-radius: 16px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); min-height: 480px; display: flex; flex-direction: column; justify-content: space-between; }
    .slide-badge { color: #fcd34d; font-size: 13px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    .slide-title { font-size: 26px; line-height: 1.3; font-weight: bold; margin-bottom: 16px; color: #fff; }
    .slide-body { font-size: 16px; line-height: 1.6; color: #d6d3d1; white-space: pre-line; margin-bottom: 20px; background: rgba(0,0,0,0.25); padding: 18px; border-radius: 12px; }
    .slide-quote { border-left: 3px solid #fcd34d; padding-left: 14px; font-style: italic; color: #fcd34d; margin-bottom: 12px; }
    .controls { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 20px auto 0; width: 100%; }
    button { background: #fcd34d; color: #0c0a09; font-weight: bold; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .counter { color: #a8a29e; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Тарас Петриненко — «Україна» (Офлайн-презентація)</h1>
  </div>
  <div class="slide-box" id="slideBox"></div>
  <div class="controls">
    <button id="prevBtn" onclick="prevSlide()">← Назад</button>
    <span class="counter" id="counter"></span>
    <button id="nextBtn" onclick="nextSlide()">Вперед →</button>
  </div>
  <script>
    const slides = [{"title":"Тарас Петриненко — «Україна»","subtitle":"Аналіз музичного твору та письмові відповіді на 8 запитань","body":"Автор музики та слів: Тарас Петриненко (1987 р.)\nЖанр: Патріотична пісня-гімн\nСтатус: Неофіційний духовний гімн України","quote":"«Дороги іншої не треба, поки зорить Чумацький Шлях...»"},{"title":"1. Яке перше враження справила пісня?","subtitle":"Перше враження","body":"Головний висновок:\nГлибоке зворушення, священний трепет та відчуття нерозривного зв’язку з рідною землею.\n\nРозгорнута відповідь:\nПісня з перших тактів справляє надзвичайно сильне, емоційне та трепетне враження. Вона викликає відчуття щирого душевного хвилювання («мурахи по шкірі») та величі. У ній немає штучного або надуманого пафосу — відразу відчувається гранична сповідальність автора, для якого любов до Батьківщини є глибоко особистим, вистражданим і священним почуттям.\n\nКлючові тези:\n• Сильне емоційне потрясіння та відчуття гордості\n• Особистісна інтимність у поєднанні з монументальною величчю\n• Миротворчий, очищувальний вплив мелодії та тексту","quote":"«Дороги іншої не треба, поки зорить Чумацький Шлях...»","terms":"Експресія, Сповідальність, Патетичність"},{"title":"2. Якими словами можна описати її характер?","subtitle":"Характер твору","body":"Головний висновок:\nУрочистий, піднесений, драматичний, щирий, життєствердний та молитовний.\n\nРозгорнута відповідь:\nХарактер пісні можна охарактеризувати як урочистий, піднесений, сповідальний, глибоко драматичний і водночас оптимістично-незламний. Музична мова поєднує ніжну синівську лірику в зачині та героїчно-монументальний дух у приспіві, що наближає твір до величного гімну-молитви.\n\nКлючові тези:\n• Урочистий та піднесено-молитовний\n• Драматичний, сповнений переживань за долю народу\n• Життєствердний і незламний","quote":"«Хай гордий лунко спів летить, як вільний птах...»","terms":"Maestoso (урочисто), Cantabile (співуче), Гімнічний склад"},{"title":"3. Які почуття передає виконавець?","subtitle":"Почуття виконавця","body":"Головний висновок:\nБезмежна синівська любов, жертовна вірність, світла печаль та непохитна віра в народ.\n\nРозгорнута відповідь:\nТарас Петриненко передає цілу гаму щирих і високих почуттів: безмежну синівську любов і ніжність до матері-України, біль за її історичні рани й терновий шлях, готовність розділити будь-яку долю з рідним краєм, а також непохитну віру у відродження і свободу свого народу.\n\nКлючові тези:\n• Синівська відданість і жертовність\n• Світла щемлива печаль від пережитих народом випробувань\n• Непохитна надія та гордість за свій народ","quote":"«Україно, Україно, ти моя надія й біль...»","terms":"Афекти (почуття), Тембральне забарвлення, Інтонаційна щирість"},{"title":"4. Як змінюється емоційне напруження?","subtitle":"Динаміка та напруження","body":"Головний висновок:\nХвилеподібний розвиток: від тихої задумливої розповіді до потужного симфонічно-хорового вибуху.\n\nРозгорнута відповідь:\nЕмоційне напруження розвивається за принципом динамічної хвилі з безперервним зростанням (crescendo). Пісня починається стримано й тихо, як інтимна бесіда мандрівника, що повертається додому. З кожним куплетом напруга невпинно зростає: мелодія виходить у високий регістр, ритм стає пульсуючим, а в приспіві досягає емоційного апогею, де голос Петриненка звучить на межі людських можливостей із непереможною енергією.\n\nКлючові тези:\n• Початок (mezzopiano): тиха мандрівна лірика, душевний спокій\n• Розвиток: прискорення внутрішнього пульсу, драматизація тексту\n• Кульмінація (forte / fortissimo): потужний приспів із гімнічною величчю","quote":"«Хай цвіте калиною вона... Україно, Україно!»","terms":"Crescendo, Кульмінація, Динамічний контраст, Форте"},{"title":"5. Якою постає Україна в пісні?","subtitle":"Образ України","body":"Головний висновок:\nЖива, рідна ненька-мати; страдниця з терновим вінцем і водночас вічна благословенна земля.\n\nРозгорнута відповідь:\nВ уяві слухача Україна постає не абстрактною територією, а живою рідною істотою — матір’ю, найдорожчою святинею, до якої завжди повертається стомлене серце. Вона одночасно і багатостраждальна земля з трагічною історією («вічний біль»), і нездоланна, сяюча зорями Чумацького Шляху краса, єдина на все життя доля, яку не обирають і не зраджують.\n\nКлючові тези:\n• Одухотворений образ Матері-Батьківщини\n• Поєднання трагічної долі та духовної чистоти й сили\n• Єдиний життєвий орієнтир і світло надії («Чумацький Шлях»)","quote":"«Україно, Україно, після далечі доріг, вірне серце твого сина я кладу тобі до ніг...»","terms":"Художній образ, Персоніфікація, Метафоричність"},{"title":"6. Які музичні засоби створюють піднесений образ?","subtitle":"Музичні засоби виразності","body":"Головний висновок:\nШирокодиханна мелодика, висхідні інтонаційні ходи, маршово-гімнічний ритм і політний вокал.\n\nРозгорнута відповідь:\nПіднесений образ формується завдяки гармонійному синтезу виразних музичних засобів:\n• Мелодика: плавна, наспівна, широкого пісенного дихання з характерними квартовими й квінтовими висхідними ходами, що символізують прагнення до волі;\n• Ладогармонічна основа: багата мажоро-мінорна гармонія, що підкреслює перехід від туги до світлого тріумфу;\n• Вокальна техніка: віртуозний вокал Тараса Петриненка з яскравим грудним резонуванням і політним верхнім регістром;\n• Аранжування: насичена інструментальна фактура з розлогими клавішними партіями та потужним бек-вокалом.\n\nКлючові тези:\n• Висхідні інтонації та розлогий мелодичний малюнок\n• Енергійний, чіткий ритмічний пульс у приспівах\n• Потужна кульмінаційна вокалізація соліста","quote":"«Я по краплі серце виллю за твоє святе ім’я...»","terms":"Мелодика, Аранжування, Гармонія, Регістр, Інтонація"},{"title":"7. Чому ця пісня стала близькою багатьом українцям?","subtitle":"Близькість для народу","body":"Головний висновок:\nНаписана серцем у доленосний час (1987 р.), вона виразила споконвічну мрію про волю та єдність.\n\nРозгорнута відповідь:\nПісня з’явилася в переломний історичний момент (1987 рік) і стала ковтком свіжого повітря та голосом пробудження нації. Вона торкнулася найглибших струн душі кожного українця, бо передала правду: без фальшивих гасел, через особисту синівську любов і біль. Слова про Чумацький Шлях і повернення до рідного порогу відгукуються як тим, хто живе в Україні, так і мільйонам українців у діаспорі по всьому світу.\n\nКлючові тези:\n• Влучне відображення національної ідентичності та духу часу\n• Зрозумілі кожному архетипні образи (дім, матір, шлях, калина)\n• Об’єднуюча сила для поколінь в Україні та за кордоном","quote":"«Бо вона у нас єдина, і в нас іншої нема...»","terms":"Національний колорит, Архетип, Соціокультурний резонанс"},{"title":"8. Чи можна вважати її музичним символом України? Чому?","subtitle":"Музичний символ нації","body":"Головний висновок:\nТак, це визнаний народний духовний гімн, що лунав у всі переломні епохи боротьби за незалежність.\n\nРозгорнута відповідь:\nБезумовно, так. Пісню «Україна» Тараса Петриненка по праву називають другим, неофіційним духовним гімном нашої держави. Вона звучала на мітингах кінця 1980-х за суверенітет, під час проголошення Незалежності у 1991 році, на Майданах під час Помаранчевої революції та Революції Гідності, а сьогодні звучить як молитва і клятва під час захисту Батьківщини. Цей твір пройшов випробування часом і став живим символом гідності, незламності та вічної любові до рідної землі.\n\nКлючові тези:\n• Статус всенародного духовного гімну поза часом\n• Невіддільність від історії боротьби за українську державність\n• Еталон української патріотичної пісенної культури","quote":"«Україно, Україно! Поки зорить Чумацький Шлях...»","terms":"Гімн, Символіка, Музична емблема нації"},{"title":"Паспорт твору та підсумок","subtitle":"Духовне значення для українського народу","body":"• Твір: «Україна» («Україно, Україно, після далечі доріг...»)\n• Композитор і поет: Тарас Петриненко (народний артист України)\n• Рік: 1987 рік\n• Жанр: Авторська патріотична пісня-гімн, лірико-драматична естрадна балада\n• Характер: Помірний, з поступовим розгортанням і crescendo (Andante con moto / Maestoso)\n• Значення: Неофіційний духовний гімн України, символ національного відродження","quote":"«Україно, Україно, після далечі доріг, вірне серце твого сина я кладу тобі до ніг!»"}];
    let cur = 0;
    function render() {
      const s = slides[cur];
      document.getElementById('slideBox').innerHTML =
        '<div class="slide-badge">' + (cur === 0 ? 'Титульний слайд' : cur === slides.length - 1 ? 'Підсумок' : 'Питання ' + cur + ' з 8') + '</div>' +
        '<div class="slide-title">' + s.title + '</div>' +
        '<div class="slide-body">' + s.body + '</div>' +
        (s.quote ? '<div class="slide-quote">' + s.quote + '</div>' : '') +
        (s.terms ? '<div style="font-size:12px;color:#a8a29e;">Музичні терміни: ' + s.terms + '</div>' : '');
      document.getElementById('counter').innerText = 'Слайд ' + (cur + 1) + ' з ' + slides.length;
      document.getElementById('prevBtn').disabled = cur === 0;
      document.getElementById('nextBtn').disabled = cur === slides.length - 1;
    }
    function prevSlide() { if(cur > 0) { cur--; render(); } }
    function nextSlide() { if(cur < slides.length - 1) { cur++; render(); } }
    document.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if(e.key === 'ArrowLeft') prevSlide();
    });
    render();
  </script>
</body>
</html>
